---
layout: blog
---
<article class="b-post">
  <p class="b-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
  <h1 class="b-title">{{ page.title }}</h1>
  <div class="b-body">
    {{ content }}
  </div>
</article>
<nav class="b-near">
  {% if page.previous %}<a href="{{ page.previous.url }}">← {{ page.previous.title }}</a>{% else %}<span></span>{% endif %}
  {% if page.next %}<a href="{{ page.next.url }}">{{ page.next.title }} →</a>{% endif %}
</nav>
