# 노션 Blog 데이터베이스 → _posts 동기화 (15분마다 + 수동 실행)
name: Notion sync
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: notion-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull posts from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python3 scripts/notion_sync.py
      - name: Commit and rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A _posts media/blog
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git config user.name "notion-sync"
          git config user.email "notion-sync@users.noreply.github.com"
          git commit -m "노션 글 동기화"
          git push
          # Actions 토큰으로 한 push는 Pages 빌드가 안 걸릴 수 있어 직접 요청
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
